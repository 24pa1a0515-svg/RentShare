<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RentShare – Student Rental &amp; Sharing Platform</title>
<meta name="description" content="RentShare lets college students rent, lend and share calculators, books, lab equipment, cycles and more. Rent What You Need. Share What You Own." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f9fc; --surface:#ffffff; --surface-2:#f1f5fb; --text:#0d1526; --muted:#5b6b85;
  --border:#e4eaf3; --primary:#2563eb; --primary-d:#1d4ed8; --indigo:#4f46e5;
  --ok:#0f9d58; --warn:#b45309; --danger:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);
  --shadow-lg:0 18px 45px rgba(15,23,42,.13);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#080d19; --surface:#111a2c; --surface-2:#18243c; --text:#e9effc; --muted:#9cb0d0;
  --border:#22304b; --primary:#6ba4fb; --primary-d:#4b8cf7; --indigo:#8f97fb;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:1160px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.navbar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Plus Jakarta Sans",Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--indigo));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px color-mix(in oklab,var(--primary) 35%,transparent)}
.navlinks{display:flex;gap:2px;margin-left:12px;flex-wrap:wrap}
.navlinks a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;transition:.18s}
.navlinks a:hover{background:var(--surface-2);color:var(--text)}
.navlinks a.active{background:color-mix(in oklab,var(--primary) 13%,transparent);color:var(--primary)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.navright>*{flex:0 0 auto}
.navlinks a{white-space:nowrap}
.btn{border:1px solid transparent;border-radius:11px;padding:10px 16px;font-weight:650;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;transition:transform .16s,box-shadow .16s,background .16s;box-shadow:0 6px 16px color-mix(in oklab,var(--primary) 25%,transparent);font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in oklab,var(--primary) 32%,transparent)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);border-color:color-mix(in oklab,var(--primary) 35%,var(--border))}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.dark{background:var(--indigo)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:.16s}
.icon-btn:hover{background:var(--surface-2)}
.burger{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.6px;margin:0 0 8px;font-weight:800}
h1{font-size:50px;line-height:1.05}
h2{font-size:27px}
.section{padding:56px 0}
.muted{color:var(--muted)}
.hero{padding:80px 0 46px;background:
  radial-gradient(900px 380px at 12% -10%,color-mix(in oklab,var(--primary) 20%,transparent),transparent),
  radial-gradient(700px 340px at 90% 0%,color-mix(in oklab,var(--indigo) 16%,transparent),transparent)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:color-mix(in oklab,var(--indigo) 12%,var(--surface));color:var(--indigo);font-weight:700;font-size:12.5px;margin-bottom:16px;border:1px solid color-mix(in oklab,var(--indigo) 22%,transparent)}
.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text);font:inherit;transition:.16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 18%,transparent)}
.err{color:var(--danger);font-size:12.5px;margin-top:4px;min-height:0}
.empty{text-align:center;padding:50px 22px;border:1.5px dashed var(--border);border-radius:var(--r);color:var(--muted);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.8}
.item-img{width:100%;height:170px;object-fit:cover;background:var(--surface-2);border-radius:12px;display:block}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:color-mix(in oklab,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
.badge.no{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger);border-color:transparent}
.badge.b{background:color-mix(in oklab,var(--primary) 14%,transparent);color:var(--primary);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{font-family:"Plus Jakarta Sans",Inter,sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.itemcard{cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.itemcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in oklab,var(--primary) 30%,var(--border))}
.cat{cursor:pointer;text-align:center;padding:20px 12px;font-weight:650;transition:.18s}
.cat:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-weight:650;font-size:13.5px;background:var(--surface);transition:.16s}
.tab:hover{border-color:var(--primary)}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;border-color:transparent}
.chat{display:grid;grid-template-columns:300px 1fr;gap:18px;min-height:480px}
.conv{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.16s}
.conv:hover{background:var(--surface-2)}
.conv.active{background:color-mix(in oklab,var(--primary) 11%,transparent);border-color:color-mix(in oklab,var(--primary) 30%,transparent)}
.msgs{height:390px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--surface-2);border-radius:12px;margin-top:12px}
.msg{max-width:74%;padding:10px 14px;border-radius:15px;background:var(--surface);border:1px solid var(--border);font-size:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;border-color:transparent}
.msg .when{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.stars{font-size:20px;cursor:pointer;letter-spacing:2px;color:#f59e0b;user-select:none}
footer{border-top:1px solid var(--border);background:var(--surface);margin-top:48px;padding:34px 0;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:650;z-index:99;box-shadow:var(--shadow-lg)}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:80;padding:16px;backdrop-filter:blur(3px)}
.modal{max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
tr:last-child th,tr:last-child td{border-bottom:none}
@media(max-width:1080px){
  .burger{display:block}
  .navlinks{display:none;position:absolute;top:68px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px;flex-direction:column;box-shadow:var(--shadow);margin-left:0}
  .navlinks.open{display:flex}
}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.chat{grid-template-columns:1fr}}
@media(max-width:720px){
  h1{font-size:34px}h2{font-size:23px}.g4,.g3,.g2{grid-template-columns:1fr}
  .hero{padding:48px 0 32px}.section{padding:38px 0}
  .burger{display:block}
  .navlinks{display:none;position:absolute;top:68px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px;flex-direction:column;box-shadow:var(--shadow)}
  .navlinks.open{display:flex}
  .msgs{height:320px}
}
</style>
</head>
<body>
<header class="nav">
  <div class="container navbar">
    <a class="brand" href="#/" data-nav><span class="logo">RS</span> RentShare</a>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="navright">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
      <span id="authArea"></span>
      <button class="icon-btn burger" id="burger">☰</button>
    </div>
  </div>
</header>
<main id="app"></main>
<footer>
  <div class="container between">
    <div><strong>RentShare</strong> — Rent What You Need. Share What You Own.</div>
    <div class="muted">A student-to-student rental &amp; sharing platform.</div>
  </div>
</footer>

<script>
/* ---------- storage ---------- */
var K={users:'rs_users',session:'rs_session',items:'rs_items',rentals:'rs_rentals',convos:'rs_convos',msgs:'rs_msgs',reviews:'rs_reviews',notifs:'rs_notifs',theme:'rs_theme'};
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function me(){var id=localStorage.getItem(K.session);if(!id)return null;return load(K.users).find(function(u){return u.id===id})||null}
var CATS=['Calculators','Books','Lab Equipment','Electronics','Project Kits','Cycles','Furniture','Cameras','Sports Equipment','Other Essentials'];
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function money(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function notify(userId,text){var n=load(K.notifs);n.unshift({id:uid(),userId:userId,text:text,at:Date.now(),read:false});save(K.notifs,n)}
function userById(id){return load(K.users).find(function(u){return u.id===id})||null}
function itemById(id){return load(K.items).find(function(i){return i.id===id})||null}
function empty(title,sub){return '<div class="empty"><div class="big">📦</div><div style="font-weight:700;color:var(--text)">'+esc(title)+'</div>'+(sub?'<div style="margin-top:6px">'+esc(sub)+'</div>':'')+'</div>'}

/* ---------- theme ---------- */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem(K.theme,t)}
applyTheme(localStorage.getItem(K.theme)||'light');
document.getElementById('themeBtn').onclick=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light')};
document.getElementById('burger').onclick=function(){document.getElementById('navlinks').classList.toggle('open')};

/* ---------- router ---------- */
function go(h){location.hash=h}
window.addEventListener('hashchange',function(){render()});
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-nav]');if(a){document.getElementById('navlinks').classList.remove('open')}
});

function navHtml(){
  var u=me(),h=location.hash||'#/';
  var links=[['#/','Home'],['#/browse','Browse Items'],['#/categories','Categories'],['#/how','How It Works']];
  if(u)links=links.concat([['#/dashboard','Dashboard'],['#/rentals','My Rentals'],['#/listings','My Listings'],['#/messages','Messages'],['#/profile','Profile']]);
  return links.map(function(l){return '<a data-nav href="'+l[0]+'" class="'+(h===l[0]?'active':'')+'">'+l[1]+'</a>'}).join('');
}
function authHtml(){
  var u=me();
  if(!u)return '<a data-nav href="#/login" class="btn ghost sm">Login</a> <a data-nav href="#/register" class="btn sm">Register</a>';
  var un=load(K.notifs).filter(function(n){return n.userId===u.id&&!n.read}).length;
  return '<a data-nav href="#/dashboard" class="btn ghost sm">'+esc(u.name.split(' ')[0])+(un?' ('+un+')':'')+'</a> <button class="btn sm danger" onclick="logout()">Logout</button>';
}
function logout(){localStorage.removeItem(K.session);toast('Logged out');go('#/');render()}

function render(){
  document.getElementById('navlinks').innerHTML=navHtml();
  document.getElementById('authArea').innerHTML=authHtml();
  var h=(location.hash||'#/').slice(1),p=h.split('/').filter(Boolean),app=document.getElementById('app');
  var u=me(),needs=['dashboard','rentals','listings','messages','profile','add','edit','rent'];
  if(needs.indexOf(p[0])>-1&&!u){app.innerHTML=viewAuthWall();return}
  var v={'':viewHome,'browse':viewBrowse,'categories':viewCategories,'how':viewHow,'login':viewLogin,'register':viewRegister,
    'dashboard':viewDashboard,'rentals':viewRentals,'listings':viewListings,'messages':viewMessages,'profile':viewProfile,
    'add':viewAddItem,'edit':viewAddItem,'item':viewItem,'rent':viewRent}[p[0]||''];
  app.innerHTML=v?v(p):'<div class="container section">'+empty('Page not found','')+'</div>';
  window.scrollTo(0,0);
  if(afterRender){var f=afterRender;afterRender=null;f()}
}
var afterRender=null;
function viewAuthWall(){return '<div class="container section"><div class="card pad" style="max-width:460px;margin:0 auto;text-align:center"><h2>Login required</h2><p class="muted">Please log in or create a student account to continue.</p><div class="row" style="justify-content:center"><a class="btn" data-nav href="#/login">Login</a><a class="btn ghost" data-nav href="#/register">Register</a></div></div></div>'}

/* ---------- home ---------- */
function viewHome(){
  var items=load(K.items);
  var latest=items.slice().sort(function(a,b){return b.at-a.at}).slice(0,3);
  return '<section class="hero"><div class="container">'+
  '<span class="pill">For college students only</span>'+
  '<h1>Rent What You Need.<br>Share What You Own.</h1>'+
  '<p class="muted" style="max-width:620px;font-size:17px">RentShare helps students borrow calculators, books, lab equipment, cycles, cameras and more for a few hours or days — instead of buying them. List the things you already own and earn from them.</p>'+
  '<div class="hero-actions"><a class="btn" data-nav href="#/browse">Browse Items</a><a class="btn ghost" data-nav href="#/add">Add Item</a></div>'+
  '</div></section>'+
  '<section class="section"><div class="container"><div class="between"><h2>Categories</h2><a class="muted" data-nav href="#/categories">View all →</a></div>'+
  '<div class="grid g4" style="margin-top:14px">'+CATS.slice(0,8).map(function(c){return '<div class="card cat" onclick="location.hash=\'#/browse?cat='+encodeURIComponent(c)+'\'">'+esc(c)+'</div>'}).join('')+'</div></div></section>'+
  '<section class="section" style="padding-top:0"><div class="container"><h2>Recently listed</h2>'+
  (latest.length?'<div class="grid g3" style="margin-top:14px">'+latest.map(itemCard).join('')+'</div>':empty('No items available yet.','Be the first student to list an item for rent.'))+
  '</div></section>'+
  '<section class="section" style="padding-top:0"><div class="container"><h2>How RentShare works</h2><div class="grid g4" style="margin-top:14px">'+
  [['1','Create your student account','Register with your college email.'],['2','List or search','Add unused items, or search what you need.'],['3','Request &amp; chat','Send a rental request and message the owner.'],['4','Return &amp; review','Complete the rental and leave a rating.']]
  .map(function(s){return '<div class="card pad"><div class="badge b">Step '+s[0]+'</div><h3 style="margin-top:10px;font-size:17px">'+s[1]+'</h3><p class="muted" style="margin:0">'+s[2]+'</p></div>'}).join('')+'</div></div></section>'+
  '<section class="section" style="padding-top:0"><div class="container"><h2>Why students use RentShare</h2><div class="grid g3" style="margin-top:14px">'+
  [['Save money','Pay by the hour or day instead of buying items you need once.'],['Earn from idle items','Your old calculator or cycle can pay for itself.'],['Campus-first','Pickup locations, deposits and chat built for college life.']]
  .map(function(b){return '<div class="card pad"><h3 style="font-size:17px">'+b[0]+'</h3><p class="muted" style="margin:0">'+b[1]+'</p></div>'}).join('')+'</div></div></section>';
}
function itemCard(i){
  var o=userById(i.ownerId);
  return '<div class="card pad itemcard" onclick="location.hash=\'#/item/'+i.id+'\'">'+
  (i.image?'<img class="item-img" src="'+esc(i.image)+'" alt="'+esc(i.name)+'" onerror="this.style.display=\'none\'">':'<div class="item-img" style="display:grid;place-items:center;color:var(--muted)">No image</div>')+
  '<div class="between" style="margin-top:12px"><strong>'+esc(i.name)+'</strong><span class="badge '+(i.available?'ok':'no')+'">'+(i.available?'Available':'Unavailable')+'</span></div>'+
  '<div class="row" style="margin-top:6px"><span class="badge">'+esc(i.category)+'</span><span class="badge">'+esc(i.condition)+'</span></div>'+
  '<p class="muted" style="margin:10px 0 6px;font-size:13.5px">'+esc((i.description||'').slice(0,90))+'</p>'+
  '<div class="between"><div><strong>'+money(i.perHour)+'</strong><span class="muted">/hr · </span><strong>'+money(i.perDay)+'</strong><span class="muted">/day</span></div></div>'+
  '<div class="muted" style="font-size:12.5px;margin-top:6px">📍 '+esc(i.location)+(o?' · '+esc(o.name):'')+'</div></div>';
}

/* ---------- auth ---------- */
function viewRegister(){
  return '<div class="container section"><div class="card pad" style="max-width:540px;margin:0 auto">'+
  '<h2>Create your student account</h2><p class="muted">Only college students can join RentShare.</p>'+
  '<form id="regForm" novalidate>'+
  fld('Full Name','name')+fld('College Name','college')+fld('Branch','branch')+
  '<label>Year of Study</label><select name="year"><option value="">Select year</option>'+[1,2,3,4,5].map(function(y){return '<option>'+y+'</option>'}).join('')+'</select><div class="err" data-e="year"></div>'+
  fld('College Email','email','email')+fld('Password','password','password')+fld('Confirm Password','confirm','password')+
  '<button class="btn" style="margin-top:16px;width:100%">Register</button></form>'+
  '<p class="muted" style="margin-top:12px">Already have an account? <a data-nav href="#/login" style="color:var(--primary);font-weight:650">Login</a></p></div></div>';
}
function fld(l,n,t){return '<label>'+l+'</label><input name="'+n+'" type="'+(t||'text')+'"><div class="err" data-e="'+n+'"></div>'}
function viewLogin(){
  return '<div class="container section"><div class="card pad" style="max-width:440px;margin:0 auto">'+
  '<h2>Welcome back</h2><p class="muted">Log in to manage your listings and rentals.</p>'+
  '<form id="loginForm" novalidate>'+fld('College Email','email','email')+fld('Password','password','password')+
  '<button class="btn" style="margin-top:16px;width:100%">Login</button></form>'+
  '<p class="muted" style="margin-top:12px">New here? <a data-nav href="#/register" style="color:var(--primary);font-weight:650">Create an account</a></p></div></div>';
}
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='regForm'){e.preventDefault();doRegister(f)}
  if(f.id==='loginForm'){e.preventDefault();doLogin(f)}
  if(f.id==='itemForm'){e.preventDefault();doItem(f)}
  if(f.id==='rentForm'){e.preventDefault();doRent(f)}
  if(f.id==='profileForm'){e.preventDefault();doProfile(f)}
  if(f.id==='reviewForm'){e.preventDefault();doReview(f)}
  if(f.id==='msgForm'){e.preventDefault();doSend(f)}
});
function setErrs(form,errs){
  form.querySelectorAll('.err').forEach(function(d){d.textContent=errs[d.dataset.e]||''});
  return Object.keys(errs).length===0;
}
function val(f,n){var el=f.elements[n];return el?String(el.value||'').trim():''}
function doRegister(f){
  var d={},errs={};['name','college','branch','year','email','password','confirm'].forEach(function(n){d[n]=val(f,n)});
  ['name','college','branch','year','email','password'].forEach(function(n){if(!d[n])errs[n]='This field is required.'});
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email))errs.email='Enter a valid email address.';
  if(d.password&&d.password.length<6)errs.password='Password must be at least 6 characters.';
  if(d.password&&d.confirm!==d.password)errs.confirm='Passwords do not match.';
  var users=load(K.users);
  if(d.email&&users.some(function(u){return u.email.toLowerCase()===d.email.toLowerCase()}))errs.email='An account with this email already exists.';
  if(!setErrs(f,errs))return;
  var u={id:uid(),name:d.name,college:d.college,branch:d.branch,year:d.year,email:d.email,password:d.password,at:Date.now()};
  users.push(u);save(K.users,users);localStorage.setItem(K.session,u.id);
  toast('Account created');go('#/dashboard');render();
}
function doLogin(f){
  var email=val(f,'email'),pw=val(f,'password'),errs={};
  if(!email)errs.email='This field is required.';
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))errs.email='Enter a valid email address.';
  if(!pw)errs.password='This field is required.';
  if(!setErrs(f,errs))return;
  var u=load(K.users).find(function(x){return x.email.toLowerCase()===email.toLowerCase()&&x.password===pw});
  if(!u){setErrs(f,{password:'Invalid email or password.'});return}
  localStorage.setItem(K.session,u.id);toast('Welcome back, '+u.name.split(' ')[0]);go('#/dashboard');render();
}

function bindBrowse(){
  var ids=['fq','fcat','fmax','favail'],keys=['q','cat','max','avail'];

  drawResults();

function drawResults(){
  var box=document.getElementById('results');if(!box)return;
  var list=load(K.items).filter(function(i){
    if(filters.q&&(i.name+' '+i.description+' '+i.category).toLowerCase().indexOf(filters.q.toLowerCase())<0)return false;
    if(filters.cat&&i.category!==filters.cat)return false;
    if(filters.max!==''&&Number(i.perDay)>Number(filters.max))return false;
    if(filters.avail!==''&&String(i.available?1:0)!==filters.avail)return false;
    return true;
  }).sort(function(a,b){return b.at-a.at});
  box.innerHTML=list.length?'<div class="grid g3">'+list.map(itemCard).join('')+'</div>'
    :(load(K.items).length?empty('No items match your filters.','Try clearing the search or filters.'):empty('No items available yet.','Items will appear here once students list them.'));
}

function viewRent(p){
  var i=itemById(p[1]),u=me();
  if(!i)return '<div class="container section">'+empty('Item not found','')+'</div>';
  if(i.ownerId===u.id)return '<div class="container section">'+empty('This is your own item.','You cannot rent an item you listed.')+'</div>';
  return '<div class="container section"><div class="card pad" style="max-width:560px;margin:0 auto">'+
  '<h2>Rent: '+esc(i.name)+'</h2><p class="muted">'+money(i.perHour)+'/hour · '+money(i.perDay)+'/day · Deposit '+money(i.deposit)+'</p>'+
  '<form id="rentForm" data-id="'+i.id+'" novalidate>'+
  '<label>Rental type</label><select name="mode" id="rmode"><option value="hour">Hourly</option><option value="day">Daily</option></select>'+
  '<div class="grid g2"><div><label>Start date &amp; time</label><input type="datetime-local" name="start" id="rstart"><div class="err" data-e="start"></div></div>'+
  '<div><label>End date &amp; time</label><input type="datetime-local" name="end" id="rend"><div class="err" data-e="end"></div></div></div>'+
  '<div class="card pad" id="calc" style="margin-top:14px;background:var(--surface-2)"></div>'+
  '<div class="err" data-e="form"></div>'+
  '<button class="btn" style="margin-top:14px;width:100%">Send Rental Request</button></form></div></div>';
}
function calcRental(i,mode,s,e){
  var ms=new Date(e)-new Date(s);
  if(!s||!e||isNaN(ms)||ms<=0)return null;
  var hours=ms/3600000,units,cost;
  if(mode==='hour'){units=Math.max(1,Math.ceil(hours));cost=units*i.perHour}
  else{units=Math.max(1,Math.ceil(hours/24));cost=units*i.perDay}
  return {units:units,hours:hours,cost:cost,deposit:i.deposit,total:cost+i.deposit,mode:mode};
}
function bindRent(){
  var f=document.getElementById('rentForm');if(!f)return;
  var i=itemById(f.dataset.id);
  function upd(){
    var r=calcRental(i,val(f,'mode'),val(f,'start'),val(f,'end')),box=document.getElementById('calc');
    box.innerHTML=r?'<div class="between"><span>Duration</span><strong>'+r.units+' '+(r.mode==='hour'?'hour':'day')+(r.units>1?'s':'')+'</strong></div>'+
      '<div class="between"><span>Rental cost</span><strong>'+money(r.cost)+'</strong></div>'+
      '<div class="between"><span>Security deposit</span><strong>'+money(r.deposit)+'</strong></div>'+
      '<div class="between" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px"><span>Total payable</span><strong>'+money(r.total)+'</strong></div>'
      :'<div class="muted">Select a valid start and end time to see the cost.</div>';
  }
  ['rmode','rstart','rend'].forEach(function(id){var el=document.getElementById(id);if(el)el.oninput=el.onchange=upd});
  upd();
}
function doRent(f){
  var u=me(),i=itemById(f.dataset.id),r=calcRental(i,val(f,'mode'),val(f,'start'),val(f,'end')),errs={};
  if(!val(f,'start'))errs.start='Select a start time.';
  if(!val(f,'end'))errs.end='Select an end time.';
  if(!errs.start&&!errs.end&&!r)errs.form='End time must be after the start time.';
  if(!setErrs(f,errs))return;
  var rentals=load(K.rentals);
  rentals.push({id:uid(),itemId:i.id,ownerId:i.ownerId,renterId:u.id,mode:r.mode,units:r.units,start:val(f,'start'),end:val(f,'end'),
    cost:r.cost,deposit:r.deposit,total:r.total,status:'Requested',at:Date.now(),reviewed:false});
  save(K.rentals,rentals);
  notify(i.ownerId,u.name+' requested to rent your "'+i.name+'".');
  toast('Rental request sent');go('#/rentals');render();
}

function stat(l,v){return '<div class="card pad"><div class="muted" style="font-size:13px">'+l+'</div><div class="stat">'+v+'</div></div>'}
function rentalRow(r,asRenter){
  var i=itemById(r.itemId),other=userById(asRenter?r.ownerId:r.renterId);
  var acts='';
  if(!asRenter){
    if(r.status==='Requested')acts='<button class="btn sm" onclick="setStatus(\''+r.id+'\',\'Accepted\')">Accept</button><button class="btn sm danger" onclick="setStatus(\''+r.id+'\',\'Rejected\')">Reject</button>';
    if(r.status==='Accepted')acts='<button class="btn sm" onclick="setStatus(\''+r.id+'\',\'Active\')">Mark active</button>';
    if(r.status==='Active')acts='<button class="btn sm" onclick="setStatus(\''+r.id+'\',\'Returned\')">Mark returned</button>';
    if(r.status==='Returned')acts='<button class="btn sm" onclick="setStatus(\''+r.id+'\',\'Completed\')">Complete</button>';
  }else{
    if(r.status==='Requested')acts='<button class="btn sm ghost" onclick="setStatus(\''+r.id+'\',\'Cancelled\')">Cancel</button>';
    if(r.status==='Completed'&&!r.reviewed)acts='<button class="btn sm" onclick="openReview(\''+r.id+'\')">Leave review</button>';
  }
  if(other)acts+='<button class="btn sm ghost" onclick="openChat(\''+other.id+'\',\''+r.itemId+'\')">Chat</button>';
  return '<div style="border-top:1px solid var(--border);padding:11px 0"><div class="between"><strong>'+esc(i?i.name:'Item removed')+'</strong><span class="badge b">'+esc(r.status)+'</span></div>'+
  '<div class="muted" style="font-size:13px">'+esc(other?other.name:'Student')+' · '+r.units+' '+r.mode+(r.units>1?'s':'')+' · '+new Date(r.start).toLocaleString()+' → '+new Date(r.end).toLocaleString()+'</div>'+
  '<div class="muted" style="font-size:13px">Rent '+money(r.cost)+' + deposit '+money(r.deposit)+' = <strong>'+money(r.total)+'</strong></div>'+
  '<div class="row" style="margin-top:8px">'+acts+'</div></div>';
}
function setStatus(id,st){
  var rentals=load(K.rentals),r=rentals.find(function(x){return x.id===id});if(!r)return;
  r.status=st;save(K.rentals,rentals);
  var i=itemById(r.itemId);
  notify(r.renterId===me().id?r.ownerId:r.renterId,'Rental for "'+(i?i.name:'an item')+'" is now '+st+'.');
  toast('Status: '+st);render();
}

function itemCardInner(i){
  return (i.image?'<img class="item-img" src="'+esc(i.image)+'" alt="'+esc(i.name)+'">':'<div class="item-img" style="display:grid;place-items:center;color:var(--muted)">No image</div>')+
  '<div class="between" style="margin-top:10px"><strong>'+esc(i.name)+'</strong><span class="badge '+(i.available?'ok':'no')+'">'+(i.available?'Available':'Unavailable')+'</span></div>'+
  '<div class="muted" style="font-size:13px">'+esc(i.category)+' · '+money(i.perHour)+'/hr · '+money(i.perDay)+'/day</div>';
}
function delItem(id){
  if(!confirm('Delete this listing?'))return;
  save(K.items,load(K.items).filter(function(i){return i.id!==id}));toast('Listing deleted');render();
}

/* ---------- messages ---------- */
var activeConvo=null;
function convoKey(a,b,itemId){return [a,b].sort().join('|')+'#'+(itemId||'')}
function openChat(otherId,itemId){
  var u=me();if(!u){go('#/login');render();return}
  if(otherId===u.id){toast('This is your own listing.');return}
  var convos=load(K.convos),key=convoKey(u.id,otherId,itemId),c=convos.find(function(x){return x.key===key});
  if(!c){c={id:uid(),key:key,members:[u.id,otherId],itemId:itemId||'',at:Date.now()};convos.push(c);save(K.convos,convos)}
  activeConvo=c.id;go('#/messages');render();
}
function viewMessages(){
  var u=me(),convos=load(K.convos).filter(function(c){return c.members.indexOf(u.id)>-1});
  var msgs=load(K.msgs);
  if(!convos.length)return '<div class="container section"><h2>Messages</h2><div style="margin-top:14px">'+empty('No conversations yet.','Open an item and message its owner to start a conversation.')+'</div></div>';
  if(!activeConvo||!convos.some(function(c){return c.id===activeConvo}))activeConvo=convos[0].id;
  var cur=convos.find(function(c){return c.id===activeConvo});
  var cm=msgs.filter(function(m){return m.convoId===cur.id}).sort(function(a,b){return a.at-b.at});
  var other=userById(cur.members.filter(function(x){return x!==u.id})[0]);
  var curItem=cur.itemId?itemById(cur.itemId):null;
  return '<div class="container section"><h2>Messages</h2><div class="chat" style="margin-top:14px">'+
  '<div class="card pad">'+convos.map(function(c){
    var o=userById(c.members.filter(function(x){return x!==u.id})[0]);
    var last=msgs.filter(function(m){return m.convoId===c.id}).sort(function(a,b){return b.at-a.at})[0];
    var ci=c.itemId?itemById(c.itemId):null;
    return '<div class="conv '+(c.id===activeConvo?'active':'')+'" onclick="activeConvo=\''+c.id+'\';render()"><strong>'+esc(o?o.name:'Student')+'</strong>'+(ci?'<div class="badge b" style="margin:4px 0">'+esc(ci.name)+'</div>':'')+'<div class="muted" style="font-size:12.5px">'+esc(last?last.text.slice(0,34):'No messages yet.')+'</div></div>';
  }).join('')+'</div>'+
  '<div class="card pad"><div class="between"><div><strong>'+esc(other?other.name:'Student')+'</strong><div class="muted" style="font-size:12.5px">'+esc(other?(other.branch+' · '+other.college):'')+'</div></div>'+
  (curItem?'<a class="badge b" data-nav href="#/item/'+curItem.id+'">About: '+esc(curItem.name)+'</a>':'')+'</div>'+
  '<div class="msgs" id="msgs">'+(cm.length?cm.map(function(m){return '<div class="msg '+(m.from===u.id?'me':'')+'">'+esc(m.text)+'<span class="when">'+new Date(m.at).toLocaleString()+'</span></div>'}).join(''):'<div class="muted" style="margin:auto;text-align:center">No messages yet.<br>Send the first message to start this conversation.</div>')+'</div>'+
  '<form id="msgForm" class="row" data-c="'+cur.id+'" style="margin-top:10px;flex-wrap:nowrap"><input name="text" placeholder="Write a message…" autocomplete="off"><button class="btn">Send</button></form>'+
  '</div></div></div>';
}
function doSend(f){
  var u=me(),text=val(f,'text');if(!text)return;
  var msgs=load(K.msgs),cid=f.dataset.c;
  msgs.push({id:uid(),convoId:cid,from:u.id,text:text,at:Date.now()});save(K.msgs,msgs);
  var c=load(K.convos).find(function(x){return x.id===cid});
  if(c)notify(c.members.filter(function(x){return x!==u.id})[0],'New message from '+u.name+'.');
  afterRender=function(){var m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight};
  render();
}

/* ---------- reviews ---------- */
function openReview(rid){
  var r=load(K.rentals).find(function(x){return x.id===rid});if(!r)return;
  var w=document.createElement('div');w.className='modal-bg';w.id='modal';
  w.innerHTML='<div class="card pad modal"><h3>Leave a review</h3><form id="reviewForm" data-r="'+rid+'" novalidate>'+
  '<label>Star rating</label><div class="stars" id="starPick" data-v="0">☆☆☆☆☆</div><div class="err" data-e="rating"></div>'+
  '<label>Your review</label><textarea name="text" rows="4"></textarea><div class="err" data-e="text"></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn">Submit review</button><button type="button" class="btn ghost" onclick="document.getElementById(\'modal\').remove()">Cancel</button></div></form></div>';
  document.body.appendChild(w);
  var sp=document.getElementById('starPick');
  sp.onclick=function(e){var rect=sp.getBoundingClientRect();var v=Math.min(5,Math.max(1,Math.ceil((e.clientX-rect.left)/(rect.width/5))));sp.dataset.v=v;sp.textContent='★'.repeat(v)+'☆'.repeat(5-v)};
}
function doReview(f){
  var u=me(),rid=f.dataset.r,rating=Number(document.getElementById('starPick').dataset.v),text=val(f,'text'),errs={};
  if(!rating)errs.rating='Select a star rating.';
  if(!text)errs.text='Please write a short review.';
  if(!setErrs(f,errs))return;
  var rentals=load(K.rentals),r=rentals.find(function(x){return x.id===rid});
  var revs=load(K.reviews);revs.push({id:uid(),rentalId:rid,itemId:r.itemId,userId:u.id,ownerId:r.ownerId,rating:rating,text:text,at:Date.now()});
  save(K.reviews,revs);r.reviewed=true;save(K.rentals,rentals);
  notify(r.ownerId,u.name+' left a '+rating+'-star review.');
  document.getElementById('modal').remove();toast('Review submitted');render();
}

/* ---------- profile ---------- */
function viewProfile(){
  var u=me(),items=load(K.items).filter(function(i){return i.ownerId===u.id});
  var revs=load(K.reviews).filter(function(r){return r.ownerId===u.id});
  var avg=revs.length?(revs.reduce(function(s,r){return s+r.rating},0)/revs.length).toFixed(1):null;
  return '<div class="container section"><h2>My Profile</h2><div class="grid g2" style="margin-top:14px">'+
  '<div class="card pad"><form id="profileForm" novalidate>'+
  '<label>Full Name</label><input name="name" value="'+esc(u.name)+'"><div class="err" data-e="name"></div>'+
  '<label>College Name</label><input name="college" value="'+esc(u.college)+'"><div class="err" data-e="college"></div>'+
  '<label>Branch</label><input name="branch" value="'+esc(u.branch)+'"><div class="err" data-e="branch"></div>'+
  '<label>Year of Study</label><select name="year">'+[1,2,3,4,5].map(function(y){return '<option '+(String(u.year)===String(y)?'selected':'')+'>'+y+'</option>'}).join('')+'</select>'+
  '<label>College Email</label><input name="email" value="'+esc(u.email)+'"><div class="err" data-e="email"></div>'+
  '<label>New Password (optional)</label><input name="password" type="password"><div class="err" data-e="password"></div>'+
  '<button class="btn" style="margin-top:16px;width:100%">Save profile</button></form></div>'+
  '<div class="card pad"><h3>Activity</h3><table><tr><th>Listed items</th><td>'+items.length+'</td></tr>'+
  '<tr><th>Owner rating</th><td>'+(avg?'★ '+avg+' ('+revs.length+' reviews)':'No reviews yet.')+'</td></tr></table>'+
  '<h3 style="margin-top:18px">Reviews received</h3>'+
  (revs.length?revs.map(function(r){return '<div style="border-top:1px solid var(--border);padding:9px 0"><span class="stars">'+'★'.repeat(r.rating)+'</span><div class="muted">'+esc(r.text)+'</div></div>'}).join(''):empty('No reviews yet.',''))+
  '</div></div></div>';
}
function doProfile(f){
  var u=me(),users=load(K.users),errs={},d={};
  ['name','college','branch','email','password'].forEach(function(n){d[n]=val(f,n)});
  ['name','college','branch','email'].forEach(function(n){if(!d[n])errs[n]='This field is required.'});
  if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email))errs.email='Enter a valid email address.';
  if(d.email&&users.some(function(x){return x.id!==u.id&&x.email.toLowerCase()===d.email.toLowerCase()}))errs.email='This email is already in use.';
  if(d.password&&d.password.length<6)errs.password='Password must be at least 6 characters.';
  if(!setErrs(f,errs))return;
  var rec=users.find(function(x){return x.id===u.id});
  rec.name=d.name;rec.college=d.college;rec.branch=d.branch;rec.year=val(f,'year');rec.email=d.email;
  if(d.password)rec.password=d.password;
  save(K.users,users);toast('Profile updated');render();
}

/* ---------- boot ---------- */
var _render=render;
render=function(){_render();
  var p=(location.hash||'#/').slice(1).split('/').filter(Boolean)[0]||'';
  if(p==='browse')bindBrowse();
  if(p==='add'||p==='edit')bindItemForm();
  if(p==='rent')bindRent();
  if(p==='messages'){var m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
  if(p==='dashboard'){var u=me();if(u){var n=load(K.notifs);var ch=false;n.forEach(function(x){if(x.userId===u.id&&!x.read){x.read=true;ch=true}});if(ch){save(K.notifs,n);document.getElementById('authArea').innerHTML=authHtml()}}}
};
render();
window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf('rs_')===0)render()});
</script>
</body>
</html>
