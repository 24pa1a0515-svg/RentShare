<style>
:root{
  --bg:#f7f9fc; --surface:#ffffff; --surface-2:#f1f5fb; --text:#0d1526; --muted:#5b6b85;
  --border:#e4eaf3; --primary:#2563eb; --primary-d:#1d4ed8; --indigo:#4f46e5;
  --ok:#0f9d58; --warn:#b45309; --danger:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);
  --shadow-lg:0 18px 45px rgba(15,23,42,.13);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#080d19; --surface:#111a2c; --surface-2:#18243c; --text:#e9effc; --muted:#9cb0d0;
  --border:#22304b; --primary:#6ba4fb; --primary-d:#4b8cf7; --indigo:#8f97fb;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:1160px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.navbar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Plus Jakarta Sans",Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--indigo));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px color-mix(in oklab,var(--primary) 35%,transparent)}
.navlinks{display:flex;gap:2px;margin-left:12px;flex-wrap:wrap}
.navlinks a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;transition:.18s}
.navlinks a:hover{background:var(--surface-2);color:var(--text)}
.navlinks a.active{background:color-mix(in oklab,var(--primary) 13%,transparent);color:var(--primary)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.navright>*{flex:0 0 auto}
.navlinks a{white-space:nowrap}
.btn{border:1px solid transparent;border-radius:11px;padding:10px 16px;font-weight:650;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;transition:transform .16s,box-shadow .16s,background .16s;box-shadow:0 6px 16px color-mix(in oklab,var(--primary) 25%,transparent);font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in oklab,var(--primary) 32%,transparent)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);border-color:color-mix(in oklab,var(--primary) 35%,var(--border))}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.dark{background:var(--indigo)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:.16s}
.icon-btn:hover{background:var(--surface-2)}
.burger{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.6px;margin:0 0 8px;font-weight:800}
h1{font-size:50px;line-height:1.05}
h2{font-size:27px}
.section{padding:56px 0}
.muted{color:var(--muted)}
.hero{padding:80px 0 46px;background:
  radial-gradient(900px 380px at 12% -10%,color-mix(in oklab,var(--primary) 20%,transparent),transparent),
  radial-gradient(700px 340px at 90% 0%,color-mix(in oklab,var(--indigo) 16%,transparent),transparent)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:color-mix(in oklab,var(--indigo) 12%,var(--surface));color:var(--indigo);font-weight:700;font-size:12.5px;margin-bottom:16px;border:1px solid color-mix(in oklab,var(--indigo) 22%,transparent)}
.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text);font:inherit;transition:.16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 18%,transparent)}
.err{color:var(--danger);font-size:12.5px;margin-top:4px;min-height:0}
.empty{text-align:center;padding:50px 22px;border:1.5px dashed var(--border);border-radius:var(--r);color:var(--muted);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.8}
.item-img{width:100%;height:170px;object-fit:cover;background:var(--surface-2);border-radius:12px;display:block}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:color-mix(in oklab,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
.badge.no{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger);border-color:transparent}
.badge.b{background:color-mix(in oklab,var(--primary) 14%,transparent);color:var(--primary);border-color:transparent}
.badge.warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{font-family:"Plus Jakarta Sans",Inter,sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.itemcard{cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.itemcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in oklab,var(--primary) 30%,var(--border))}
.cat{cursor:pointer;text-align:center;padding:20px 12px;font-weight:650;transition:.18s}
.cat:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-weight:650;font-size:13.5px;background:var(--surface);transition:.16s}
.tab:hover{border-color:var(--primary)}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;border-color:transparent}
.chat{display:grid;grid-template-columns:300px 1fr;gap:18px;min-height:480px}
.conv{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.16s}
.conv:hover{background:var(--surface-2)}
.conv.active{background:color-mix(in oklab,var(--primary) 11%,transparent);border-color:color-mix(in oklab,var(--primary) 30%,transparent)}
.msgs{height:390px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--surface-2);border-radius:12px;margin-top:12px}
.msg{max-width:74%;padding:10px 14px;border-radius:15px;background:var(--surface);border:1px solid var(--border);font-size:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--indigo));color:#fff;border-color:transparent}
.msg .when{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.stars{font-size:20px;cursor:pointer;letter-spacing:2px;color:#f59e0b;user-select:none}
footer{border-top:1px solid var(--border);background:var(--surface);margin-top:48px;padding:34px 0;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:650;z-index:99;box-shadow:var(--shadow-lg);transition:opacity .2s}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:80;padding:16px;backdrop-filter:blur(3px)}
.modal{max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
tr:last-child th,tr:last-child td{border-bottom:none}
@media(max-width:1080px){
  .burger{display:block}
  .navlinks{display:none;position:absolute;top:68px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px;flex-direction:column;box-shadow:var(--shadow);margin-left:0}
  .navlinks.open{display:flex}
}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.chat{grid-template-columns:1fr}}
@media(max-width:720px){
  h1{font-size:34px}h2{font-size:23px}.g4,.g3,.g2{grid-template-columns:1fr}
  .hero{padding:48px 0 32px}.section{padding:38px 0}
  .burger{display:block}
  .navlinks{display:none;position:absolute;top:68px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px;flex-direction:column;box-shadow:var(--shadow)}
  .navlinks.open{display:flex}
  .msgs{height:320px}
}
</style>
</head>
<body>
<header class="nav">
  <div class="container navbar">
    <a class="brand" href="#/" data-nav><span class="logo">RS</span> RentShare</a>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="navright">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
      <span id="authArea"></span>
      <button class="icon-btn burger" id="burger">☰</button>
    </div>
  </div>
</header>
<main id="app"></main>
<footer>
  <div class="container between">
    <div><strong>RentShare</strong> — Rent What You Need. Share What You Own.</div>
    <div class="muted">A student-to-student rental &amp; sharing platform.</div>
  </div>
</footer>

<script>
/* ---------- Firebase Configuration & Initialization ---------- */
var firebaseConfig = {
  apiKey: "AIzaSyBe_Aw8W0mW7f15eVN5AIVTy9htMUo09ZU",
  authDomain: "rentshare-28a55.firebaseapp.com",
  projectId: "rentshare-28a55",
  storageBucket: "rentshare-28a55.firebasestorage.app",
  messagingSenderId: "800537673493",
  appId: "1:800537673493:web:c4e0fdcb163039d034731c",
  measurementId: "G-GT7F2NKP35"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var storage = firebase.storage();

/* ---------- Application State ---------- */
var state = {
  users: {},         // cached student profiles
  items: [],         // all listings from Firestore
  rentals: [],       // user's rentals as owner or renter
  conversations: [], // user's conversations
  messages: [],      // messages for activeConvo
  reviews: [],       // reviews from Firestore
  notifications: []  // user's notifications
};

var currentUser = null;
var activeConvo = null;
var rentalTab = 'All';
var filters = {q:'', cat:'', max:'', avail:''};
var afterRender = null;

var CATS = ['Calculators','Books','Lab Equipment','Electronics','Project Kits','Cycles','Furniture','Cameras','Sports Equipment','Other Essentials'];

/* ---------- Helpers & Utilities ---------- */
var esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};

function money(n){
  return '₹' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-IN');
}

function toast(m){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = m;
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 200);
  }, 2200);
}

function me(){
  return currentUser;
}

function userById(id){
  if (!id) return null;
  if (currentUser && (currentUser.uid === id || currentUser.id === id)) return currentUser;
  if (state.users[id]) return state.users[id];
  fetchMissingUsers([id]);
  return null;
}

function itemById(id){
  if (!id) return null;
  return state.items.find(function(i){ return i.id === id; }) || null;
}

function empty(title, sub){
  return '<div class="empty"><div class="big">📦</div><div style="font-weight:700;color:var(--text)">' +
    esc(title) + '</div>' + (sub ? '<div style="margin-top:6px">' + esc(sub) + '</div>' : '') + '</div>';
}

function fld(l, n, t, valDefault){
  return '<label>' + l + '</label><input name="' + n + '" type="' + (t || 'text') + '" value="' + esc(valDefault || '') + '"><div class="err" data-e="' + n + '"></div>';
}

function val(f, n){
  var el = f.elements[n];
  return el ? String(el.value || '').trim() : '';
}

function setErrs(form, errs){
  form.querySelectorAll('.err').forEach(function(d){
    d.textContent = errs[d.dataset.e] || '';
  });
  return Object.keys(errs).length === 0;
}

/* User profile caching helper */
function fetchMissingUsers(ids){
  var missing = Array.from(new Set(ids)).filter(function(id){
    return id && !state.users[id] && (!currentUser || (currentUser.uid !== id && currentUser.id !== id));
  });
  if (!missing.length) return;
  missing.forEach(function(id){
    state.users[id] = { id: id, name: 'Student' };
    db.collection('users').doc(id).get().then(function(doc){
      if (doc.exists) {
        state.users[id] = Object.assign({ id: doc.id, uid: doc.id }, doc.data());
        render();
      }
    }).catch(function(e){
      console.warn('Failed to load user profile for', id, e);
    });
  });
}

/* Real-time Notifications helper */
async function notifyUser(userId, text, type, link){
  if (!userId) return;
  try {
    await db.collection('notifications').add({
      userId: userId,
      text: text,
      type: type || 'general',
      link: link || '',
      read: false,
      at: Date.now(),
      createdAt: Date.now()
    });
  } catch (err) {
    console.warn('Failed to dispatch notification:', err);
  }
}

/* Mark notifications as read */
async function markNotificationsRead(){
  var u = me();
  if (!u) return;
  var myUid = u.id || u.uid;
  var unread = state.notifications.filter(function(n){
    return n.userId === myUid && !n.read;
  });
  if (!unread.length) return;
  var batch = db.batch();
  unread.forEach(function(n){
    var ref = db.collection('notifications').doc(n.id);
    batch.update(ref, { read: true });
  });
  try {
    await batch.commit();
  } catch (e) {
    console.warn('Error marking notifications read:', e);
  }
}

/* Fetch active/accepted bookings directly from Firestore for a specific item */
async function getItemBookings(itemId){
  if (!itemId) return [];
  try {
    var snap = await db.collection('rentals').where('itemId', '==', itemId).get();
    var bookings = [];
    snap.forEach(function(doc){
      var d = doc.data();
      if (d.status === 'Accepted' || d.status === 'Active') {
        bookings.push(Object.assign({ id: doc.id }, d));
      }
    });
    return bookings;
  } catch (e) {
    console.warn('Direct Firestore query for item bookings fell back to cache:', e);
    return state.rentals.filter(function(r){
      return r.itemId === itemId && (r.status === 'Accepted' || r.status === 'Active');
    });
  }
}

/* ---------- Theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rs_theme', t);
}
applyTheme(localStorage.getItem('rs_theme') || 'light');
document.getElementById('themeBtn').onclick = function(){
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
};
document.getElementById('burger').onclick = function(){
  document.getElementById('navlinks').classList.toggle('open');
};

/* ---------- Router ---------- */
function go(h){
  location.hash = h;
}
window.addEventListener('hashchange', function(){
  render();
});
document.addEventListener('click', function(e){
  var a = e.target.closest('a[data-nav]');
  if (a) {
    document.getElementById('navlinks').classList.remove('open');
  }
});

function navHtml(){
  var u = me(), h = location.hash || '#/';
  var links = [['#/', 'Home'], ['#/browse', 'Browse Items'], ['#/categories', 'Categories'], ['#/how', 'How It Works']];
  if (u) {
    links = links.concat([
      ['#/dashboard', 'Dashboard'],
      ['#/rentals', 'My Rentals'],
      ['#/listings', 'My Listings'],
      ['#/messages', 'Messages'],
      ['#/profile', 'Profile']
    ]);
  }
  return links.map(function(l){
    return '<a data-nav href="' + l[0] + '" class="' + (h === l[0] ? 'active' : '') + '">' + l[1] + '</a>';
  }).join('');
}

function authHtml(){
  var u = me();
  if (!u) return '<a data-nav href="#/login" class="btn ghost sm">Login</a> <a data-nav href="#/register" class="btn sm">Register</a>';
  var un = state.notifications.filter(function(n){
    return n.userId === (u.id || u.uid) && !n.read;
  }).length;
  return '<a data-nav href="#/dashboard" class="btn ghost sm">' +
    esc((u.name || 'Student').split(' ')[0]) + (un ? ' (' + un + ')' : '') +
    '</a> <button class="btn sm danger" onclick="logout()">Logout</button>';
}

function render(){
  document.getElementById('navlinks').innerHTML = navHtml();
  document.getElementById('authArea').innerHTML = authHtml();
  var h = (location.hash || '#/').slice(1), p = h.split('/').filter(Boolean), app = document.getElementById('app');
  var u = me(), needs = ['dashboard', 'rentals', 'listings', 'messages', 'profile', 'add', 'edit', 'rent'];
  if (needs.indexOf(p[0]) > -1 && !u) {
    app.innerHTML = viewAuthWall();
    return;
  }
  var v = {
    '': viewHome,
    'browse': viewBrowse,
    'categories': viewCategories,
    'how': viewHow,
    'login': viewLogin,
    'register': viewRegister,
    'dashboard': viewDashboard,
    'rentals': viewRentals,
    'listings': viewListings,
    'messages': viewMessages,
    'profile': viewProfile,
    'add': viewAddItem,
    'edit': viewAddItem,
    'item': viewItem,
    'rent': viewRent
  }[p[0] || ''];

  app.innerHTML = v ? v(p) : '<div class="container section">' + empty('Page not found', '') + '</div>';
  window.scrollTo(0, 0);

  // Trigger post-render callbacks
  if (p[0] === 'browse') bindBrowse();
  if (p[0] === 'add' || p[0] === 'edit') bindItemForm();
  if (p[0] === 'rent') bindRent();
  if (p[0] === 'messages') {
    var m = document.getElementById('msgs');
    if (m) m.scrollTop = m.scrollHeight;
  }
  if (p[0] === 'dashboard') {
    markNotificationsRead();
  }
  if (p[0] === 'register') {
    updateRegisterYears();
  }
  if (p[0] === 'profile') {
    updateProfileYears();
  }

  if (afterRender) {
    var f = afterRender;
    afterRender = null;
    f();
  }
}

function viewAuthWall(){
  return '<div class="container section"><div class="card pad" style="max-width:460px;margin:0 auto;text-align:center">' +
    '<h2>Login required</h2><p class="muted">Please log in or create a student account to continue.</p>' +
    '<div class="row" style="justify-content:center">' +
    '<a class="btn" data-nav href="#/login">Login</a>' +
    '<a class="btn ghost" data-nav href="#/register">Register</a>' +
    '</div></div></div>';
}

/* ---------- Home ---------- */
function viewHome(){
  var latest = state.items.slice().sort(function(a, b){
    return (b.at || b.createdAt || 0) - (a.at || a.createdAt || 0);
  }).slice(0, 3);

  return '<section class="hero"><div class="container">' +
    '<span class="pill">For college students only</span>' +
    '<h1>Rent What You Need.<br>Share What You Own.</h1>' +
    '<p class="muted" style="max-width:620px;font-size:17px">RentShare helps students borrow calculators, books, lab equipment, cycles, cameras and more for a few hours or days — instead of buying them. List the things you already own and earn from them.</p>' +
    '<div class="hero-actions"><a class="btn" data-nav href="#/browse">Browse Items</a><a class="btn ghost" data-nav href="#/add">Add Item</a></div>' +

/* ---------- Course & Year of Study Helper ---------- */
var COURSE_DURATIONS = {
  'B.Tech': 4,
  'B.E.': 4,
  'B.Sc.': 3,
  'B.Com.': 3,
  'B.A.': 3,
  'BBA': 3,
  'BCA': 3,
  'B.Pharm': 4,
  'B.Arch': 5,
  'B.Des': 4,
  'B.Ed': 2,
  'LLB': 3,
  'BA LLB': 5,
  'BBA LLB': 5,
  'B.Com LLB': 5,
  'M.Tech': 2,
  'M.E.': 2,
  'M.Sc.': 2,
  'M.Com.': 2,
  'M.A.': 2,
  'MBA': 2,
  'MCA': 2,
  'M.Pharm': 2,
  'M.Arch': 2,
  'M.Ed': 2,
  'LLM': 2,
  'Ph.D.': 5,
  'Dual Degree': 5,
  'Other': 4
};

var COURSES = Object.keys(COURSE_DURATIONS);

function yearLabel(n){
  if (n === 1) return '1st Year';
  if (n === 2) return '2nd Year';
  if (n === 3) return '3rd Year';
  return n + 'th Year';
}

function getCourseDuration(courseName, branchName){
  var c = String(courseName || '').trim();
  if (COURSE_DURATIONS[c]) return COURSE_DURATIONS[c];

  var clean = c.replace(/\./g, '').toLowerCase();
  for (var key in COURSE_DURATIONS) {
    if (key.replace(/\./g, '').toLowerCase() === clean) {
      return COURSE_DURATIONS[key];
    }
  }

  var b = String(branchName || '').replace(/\./g, '').toLowerCase();
  for (var key in COURSE_DURATIONS) {
    var kClean = key.replace(/\./g, '').toLowerCase();
    if (b.indexOf(kClean) > -1) {
      return COURSE_DURATIONS[key];
    }
  }

  return 4;
}

function getCourseYears(courseName, branchName){
  var dur = getCourseDuration(courseName, branchName);
  var years = [];
  for (var i = 1; i <= dur; i++) {
    years.push(yearLabel(i));
  }
  return {
    duration: dur + ' Year' + (dur > 1 ? 's' : ''),
    durYears: dur,
    years: years
  };
}

function updateRegisterYears(){
  var courseEl = document.getElementById('regCourse');
  var branchEl = document.querySelector('#regForm input[name="branch"]');
  var yearEl = document.getElementById('regYearSelect') || document.querySelector('#regForm select[name="year"]');
  var durEl = document.getElementById('courseDurationText');
  if (!yearEl) return;

  var cVal = courseEl ? courseEl.value : 'B.Tech';
  var bVal = branchEl ? branchEl.value : '';
  var data = getCourseYears(cVal, bVal);
  if (durEl) durEl.textContent = 'Course Duration: ' + data.duration;

  var previousYear = yearEl.value;
  yearEl.innerHTML = '';

  var defaultOpt = document.createElement('option');
  defaultOpt.value = '';
  defaultOpt.textContent = 'Select year';
  yearEl.appendChild(defaultOpt);

  var isPreviousYearValid = false;
  data.years.forEach(function(y){
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (previousYear && (previousYear === y || previousYear === y.replace(/[^0-9]/g, ''))) {
      opt.selected = true;
      isPreviousYearValid = true;
    }
    yearEl.appendChild(opt);
  });

  if (!isPreviousYearValid) {
    yearEl.value = '';
  }
}

async function doRegister(f){
  var d = {}, errs = {};
  ['name','college','course','branch','year','email','password','confirm'].forEach(function(n){ d[n] = val(f, n); });
  ['name','college','branch','year','email','password'].forEach(function(n){ if (!d[n]) errs[n] = 'This field is required.'; });

  var courseName = d.course || 'B.Tech';
  var courseInfo = getCourseYears(courseName, d.branch);
  if (d.year && courseInfo.years.indexOf(d.year) < 0 && courseInfo.years.map(function(y){ return y.replace(/[^0-9]/g, ''); }).indexOf(d.year) < 0) {
    errs.year = courseName + ' is a ' + courseInfo.duration + ' course. Maximum year allowed is ' + courseInfo.years[courseInfo.years.length - 1] + '.';
  }

  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) errs.email = 'Enter a valid email address.';
  if (d.password && d.password.length < 6) errs.password = 'Password must be at least 6 characters.';
  if (d.password && d.confirm !== d.password) errs.confirm = 'Passwords do not match.';
  if (!setErrs(f, errs)) return;

  var btn = f.querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Registering...'; }

  try {
    var cred = await auth.createUserWithEmailAndPassword(d.email, d.password);
    var uid = cred.user.uid;
    await cred.user.updateProfile({ displayName: d.name });

    var profileData = {
      uid: uid,
      id: uid,
      name: d.name,
      college: d.college,
      course: courseName,
      branch: d.branch,
      year: d.year,
      email: d.email,
      at: Date.now(),
      createdAt: Date.now()
    };

    await db.collection('users').doc(uid).set(profileData);
    currentUser = profileData;
    state.users[uid] = profileData;

    toast('Account created successfully');
    go('#/dashboard');
  } catch (err) {
    console.error('Registration error:', err);
    if (err.code === 'auth/email-already-in-use') {
      setErrs(f, { email: 'An account with this email already exists.' });
    } else if (err.code === 'auth/invalid-email') {
      setErrs(f, { email: 'Invalid email address.' });
    } else if (err.code === 'auth/operation-not-allowed') {
      setErrs(f, { email: 'Email/Password sign-in is not enabled in Firebase Console. Enable it in Authentication > Sign-in method.' });
    } else {
      setErrs(f, { password: err.message || 'Registration failed.' });
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Register'; }
  }
}

async function doLogin(f){
  var email = val(f, 'email'), pw = val(f, 'password'), errs = {};
  if (!email) errs.email = 'This field is required.';
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) errs.email = 'Enter a valid email address.';
  if (!pw) errs.password = 'This field is required.';
  if (!setErrs(f, errs)) return;

  var btn = f.querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Logging in...'; }

  try {
    var cred = await auth.signInWithEmailAndPassword(email, pw);
    var uid = cred.user.uid;
    var userDoc = await db.collection('users').doc(uid).get();
    if (userDoc.exists) {
      currentUser = Object.assign({ uid: uid, id: uid }, userDoc.data());
    } else {
      currentUser = { uid: uid, id: uid, name: cred.user.displayName || email.split('@')[0], email: email };
    }
    state.users[uid] = currentUser;
    toast('Welcome back, ' + (currentUser.name || 'Student').split(' ')[0]);
    go('#/dashboard');
  } catch (err) {
    console.error('Login error:', err);
    setErrs(f, { password: 'Invalid email or password.' });
    if (btn) { btn.disabled = false; btn.textContent = 'Login'; }
  }
}

async function logout(){
  try {
    await auth.signOut();
    currentUser = null;
    toast('Logged out');
    go('#/');
  } catch (err) {
    console.error('Logout error:', err);
  }
}

function drawResults(){
  var box = document.getElementById('results');
  if (!box) return;
  var now = new Date();
  var list = state.items.filter(function(i){
    var isCurrentlyBooked = state.rentals.some(function(r){
      return r.itemId === i.id && (r.status === 'Accepted' || r.status === 'Active') &&
        now >= new Date(r.start) && now <= new Date(r.end);
    });
    var isAvail = i.available && !isCurrentlyBooked;

    if (filters.q && ((i.name || '') + ' ' + (i.description || '') + ' ' + (i.category || '')).toLowerCase().indexOf(filters.q.toLowerCase()) < 0) return false;
    if (filters.cat && i.category !== filters.cat) return false;
    if (filters.max !== '' && Number(i.perDay) > Number(filters.max)) return false;
    if (filters.avail !== '' && String(isAvail ? 1 : 0) !== filters.avail) return false;
    return true;
  }).sort(function(a, b){
    return (b.at || b.createdAt || 0) - (a.at || a.createdAt || 0);
  });

  box.innerHTML = list.length ? '<div class="grid g3">' + list.map(itemCard).join('') + '</div>' :
    (state.items.length ? empty('No items match your filters.', 'Try clearing the search or filters.') : empty('No items available yet.', 'Items will appear here once students list them.'));

async function doItem(f){
  var u = me(), errs = {}, d = {};
  if (!u) { toast('Please log in'); go('#/login'); return; }

  ['name','category','description','image','condition','perHour','perDay','deposit','location'].forEach(function(n){ d[n] = val(f, n); });
  ['name','category','description','condition','location'].forEach(function(n){ if (!d[n]) errs[n] = 'This field is required.'; });
  ['perHour','perDay','deposit'].forEach(function(n){ if (d[n] === '' || isNaN(Number(d[n])) || Number(d[n]) < 0) errs[n] = 'Enter a valid amount.'; });
  if (!setErrs(f, errs)) return;

  var btn = f.querySelector('button[type="submit"]') || f.querySelector('button');
  var origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  try {
    var fileInput = document.getElementById('imgFile');
    var imageUrl = d.image;

    // Upload to Firebase Storage if a local file was chosen
    if (fileInput && fileInput.files && fileInput.files[0]) {
      var file = fileInput.files[0];
      if (btn) btn.textContent = 'Uploading to Firebase Storage...';
      var cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
      var storagePath = 'listings/' + Date.now() + '_' + cleanName;
      var fileRef = storage.ref().child(storagePath);
      var snap = await fileRef.put(file);
      imageUrl = await snap.ref.getDownloadURL();
    }

    var id = f.dataset.id;
    var itemData = {
      name: d.name,
      category: d.category,
      description: d.description,
      image: imageUrl || '',
      condition: d.condition,
      perHour: Number(d.perHour),
      perDay: Number(d.perDay),
      deposit: Number(d.deposit),
      location: d.location,
      available: val(f, 'available') === '1',
      updatedAt: Date.now()
    };

    if (id) {
      await db.collection('listings').doc(id).update(itemData);
      toast('Item updated');
    } else {
      itemData.ownerId = u.id || u.uid;
      itemData.at = Date.now();
      itemData.createdAt = Date.now();
      await db.collection('listings').add(itemData);
      toast('Item published');
    }
    go('#/listings');
  } catch (err) {
    console.error('Error saving item:', err);
    toast('Error: ' + (err.message || 'Failed to save item'));
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }

    '<div class="grid g2"><div><label>Start date &amp; time</label><input type="datetime-local" name="start" id="rstart"><div class="err" data-e="start"></div></div>' +
    '<div><label>End date &amp; time</label><input type="datetime-local" name="end" id="rend"><div class="err" data-e="end"></div></div></div>' +
    '<div id="rentBookingsBox" class="card pad" style="margin-top:14px;background:var(--surface-2)">Loading schedule availability…</div>' +
    '<div class="card pad" id="calc" style="margin-top:14px;background:var(--surface-2)"></div>' +

    '<button class="btn" style="margin-top:14px;width:100%" type="submit">Send Rental Request</button></form></div></div>';

function calcRental(i, mode, s, e){
  var ms = new Date(e) - new Date(s);
  if (!s || !e || isNaN(ms) || ms <= 0) return null;
  var hours = ms / 3600000, units, cost;
  if (mode === 'hour') {
    units = Math.max(1, Math.ceil(hours));
    cost = units * i.perHour;
  } else {
    units = Math.max(1, Math.ceil(hours / 24));
    cost = units * i.perDay;
  }
  return { units: units, hours: hours, cost: cost, deposit: i.deposit, total: cost + i.deposit, mode: mode };
}

function bindRent(){
  var f = document.getElementById('rentForm');
  if (!f) return;
  var itemId = f.dataset.id;
  var i = itemById(itemId);
  if (!i) return;

  var itemBookings = [];
  getItemBookings(itemId).then(function(b){
    itemBookings = b;
    var bookingsBox = document.getElementById('rentBookingsBox');
    if (bookingsBox) {
      if (itemBookings.length) {
        bookingsBox.innerHTML = '<strong>⚠️ Existing Bookings for this item:</strong><div class="muted" style="font-size:12.5px;margin-top:4px">Your requested rental period cannot overlap with these accepted slots:</div>' +
          itemBookings.map(function(b){
            return '<div style="font-size:13px;font-weight:600;margin-top:4px;color:var(--warn)">• ' + new Date(b.start).toLocaleString() + ' → ' + new Date(b.end).toLocaleString() + ' (' + esc(b.status) + ')</div>';
          }).join('');
      } else {
        bookingsBox.innerHTML = '<span style="color:var(--ok)">✓ No scheduling conflicts. Pick any start and end time.</span>';
      }
    }
    upd();
  });

  function upd(){
    var sVal = val(f, 'start'), eVal = val(f, 'end');
    var r = calcRental(i, val(f, 'mode'), sVal, eVal), box = document.getElementById('calc');
    var errBox = f.querySelector('.err[data-e="form"]');
    var submitBtn = f.querySelector('button[type="submit"]') || f.querySelector('button');

    if (sVal && eVal) {
      var sDate = new Date(sVal), eDate = new Date(eVal);
      if (sDate >= eDate) {
        if (errBox) errBox.textContent = 'End time must be strictly after the start time.';
        if (submitBtn) submitBtn.disabled = true;
      } else {
        var conflict = itemBookings.find(function(ex){
          var exStart = new Date(ex.start), exEnd = new Date(ex.end);
          return (sDate < exEnd && eDate > exStart);
        });
        if (conflict) {
          if (errBox) errBox.textContent = '⚠️ Overlaps with an accepted booking from ' + new Date(conflict.start).toLocaleString() + ' to ' + new Date(conflict.end).toLocaleString() + '. Please choose another time slot.';
          if (submitBtn) submitBtn.disabled = true;
        } else {
          if (errBox) errBox.textContent = '';
          if (submitBtn) submitBtn.disabled = false;
        }
      }
    } else {
      if (errBox) errBox.textContent = '';
      if (submitBtn) submitBtn.disabled = false;
    }

    if (!box) return;
    box.innerHTML = r ? '<div class="between"><span>Duration</span><strong>' + r.units + ' ' + (r.mode === 'hour' ? 'hour' : 'day') + (r.units > 1 ? 's' : '') + '</strong></div>' +
      '<div class="between"><span>Rental cost</span><strong>' + money(r.cost) + '</strong></div>' +
      '<div class="between"><span>Security deposit</span><strong>' + money(r.deposit) + '</strong></div>' +
      '<div class="between" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px"><span>Total payable</span><strong>' + money(r.total) + '</strong></div>'
      : '<div class="muted">Select a valid start and end time to see the cost.</div>';
  }

  ['rmode', 'rstart', 'rend'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.oninput = el.onchange = upd;
  });
  upd();
}

async function doRent(f){
  var u = me();
  if (!u) { toast('Please log in'); go('#/login'); return; }
  var myUid = u.id || u.uid;
  var itemId = f.dataset.id;
  var i = itemById(itemId);
  if (!i) { toast('Item not found'); return; }

  // Prevent owners from renting their own items
  if (i.ownerId === myUid) {
    setErrs(f, { form: 'Owners cannot rent their own items.' });
    return;
  }

  var s = val(f, 'start'), e = val(f, 'end');
  var r = calcRental(i, val(f, 'mode'), s, e), errs = {};
  if (!s) errs.start = 'Select a start time.';
  if (!e) errs.end = 'Select an end time.';
  if (!errs.start && !errs.end && !r) errs.form = 'End time must be after the start time.';
  if (!setErrs(f, errs)) return;

  var startDate = new Date(s), endDate = new Date(e);
  if (startDate >= endDate) {
    setErrs(f, { form: 'End time must be strictly after the start time.' });
    return;
  }

  var btn = f.querySelector('button[type="submit"]') || f.querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking availability...'; }

  try {
    // 10. Rental conflicts checked using Firestore data
    var snapshot = await db.collection('rentals').where('itemId', '==', i.id).get();
    var existingRentals = [];
    snapshot.forEach(function(doc){ existingRentals.push(Object.assign({ id: doc.id }, doc.data())); });

    // Prevent duplicate requests by same user for overlapping dates
    var duplicateReq = existingRentals.find(function(ex){
      if (ex.renterId !== myUid) return false;
      if (ex.status !== 'Requested' && ex.status !== 'Accepted' && ex.status !== 'Active') return false;
      var exStart = new Date(ex.start), exEnd = new Date(ex.end);
      return (startDate < exEnd && endDate > exStart);
    });
    if (duplicateReq) {
      setErrs(f, {
        form: 'You already have an existing rental request for this item during that period (' + duplicateReq.status + ').'
      });
      if (btn) { btn.disabled = false; btn.textContent = 'Send Rental Request'; }
      return;
    }

    // Check if item is already booked (Accepted/Active) by any user during this period
    var bookedConflict = existingRentals.find(function(ex){
      if (ex.status !== 'Accepted' && ex.status !== 'Active') return false;
      var exStart = new Date(ex.start), exEnd = new Date(ex.end);
      return (startDate < exEnd && endDate > exStart);
    });
    if (bookedConflict) {
      setErrs(f, {
        form: 'This item is already booked from ' + new Date(bookedConflict.start).toLocaleString() + ' to ' + new Date(bookedConflict.end).toLocaleString() + '. Please choose different dates.'
      });
      if (btn) { btn.disabled = false; btn.textContent = 'Send Rental Request'; }
      return;
    }

    btn.textContent = 'Sending request...';
    var rentalData = {
      itemId: i.id,
      ownerId: i.ownerId,
      renterId: myUid,
      mode: r.mode,
      units: r.units,
      start: s,
      end: e,
      cost: r.cost,
      deposit: r.deposit,
      total: r.total,
      status: 'Requested',
      at: Date.now(),
      createdAt: Date.now(),
      reviewed: false
    };

    await db.collection('rentals').add(rentalData);
    await notifyUser(i.ownerId, (u.name || 'Student') + ' requested to rent your "' + i.name + '".', 'rental_request', '#/dashboard');
    toast('Rental request sent');
    go('#/rentals');
  } catch (err) {
    console.error('Failed to submit rental request:', err);
    setErrs(f, { form: 'Error: ' + (err.message || 'Please try again.') });
    if (btn) { btn.disabled = false; btn.textContent = 'Send Rental Request'; }
  }
}

async function setStatus(id, st){
  var u = me();
  if (!u) return;
  var r = state.rentals.find(function(x){ return x.id === id; });
  if (!r) return;

  // Real-time Firestore conflict validation when owner accepts a request
  if (st === 'Accepted') {
    var rStart = new Date(r.start), rEnd = new Date(r.end);
    try {
      var snapshot = await db.collection('rentals').where('itemId', '==', r.itemId).get();
      var allRentals = [];
      snapshot.forEach(function(doc){ allRentals.push(Object.assign({ id: doc.id }, doc.data())); });

      var conflict = allRentals.find(function(ex){
        if (ex.id === r.id) return false;
        if (ex.status !== 'Accepted' && ex.status !== 'Active') return false;
        var exStart = new Date(ex.start), exEnd = new Date(ex.end);
        return (rStart < exEnd && rEnd > exStart);
      });

      if (conflict) {
        alert('Cannot accept request: Another rental is already booked from ' +
          new Date(conflict.start).toLocaleString() + ' to ' + new Date(conflict.end).toLocaleString() + '.');
        return;
      }

      // Auto-reject any conflicting pending 'Requested' rentals for this item
      var conflictingPending = allRentals.filter(function(ex){
        if (ex.id === r.id || ex.status !== 'Requested') return false;
        var exStart = new Date(ex.start), exEnd = new Date(ex.end);
        return (rStart < exEnd && rEnd > exStart);
      });

      for (var cp of conflictingPending) {
        db.collection('rentals').doc(cp.id).update({
          status: 'Rejected',
          updatedAt: Date.now()
        }).catch(function(){});
        notifyUser(cp.renterId, 'Your rental request was declined because the time slot was booked by another student.', 'status_rejected', '#/rentals');
      }
    } catch (e) {
      console.warn('Error verifying Firestore bookings before accept:', e);
    }
  }

  try {
    await db.collection('rentals').doc(id).update({
      status: st,
      updatedAt: Date.now()
    });

    var i = itemById(r.itemId);
    var targetUser = (r.renterId === (u.id || u.uid)) ? r.ownerId : r.renterId;
    var itemName = i ? i.name : 'an item';
    await notifyUser(targetUser, 'Rental for "' + itemName + '" is now ' + st + '.', 'status_' + st.toLowerCase(), '#/rentals');
    toast('Status: ' + st);
  } catch (err) {
    console.error('Error updating rental status:', err);
    toast('Error: ' + err.message);
  }
}

}

/* ---------- Student-to-Student Chat ---------- */
function convoKey(a, b, itemId){
  return [a, b].sort().join('|') + '#' + (itemId || '');
}

async function openChat(otherId, itemId){
  var u = me();
  if (!u) { go('#/login'); render(); return; }
  var myUid = u.id || u.uid;
  if (otherId === myUid) {
    toast('This is your own listing.');
    return;
  }

  var key = convoKey(myUid, otherId, itemId);
  var c = state.conversations.find(function(x){ return x.key === key; });

  if (!c) {
    try {
      var q = await db.collection('conversations').where('members', 'array-contains', myUid).get();
      q.forEach(function(doc){
        if (doc.data().key === key) c = Object.assign({ id: doc.id }, doc.data());
      });

      if (!c) {
        var docRef = await db.collection('conversations').add({
          key: key,
          members: [myUid, otherId],
          itemId: itemId || '',
          lastMessage: '',
          at: Date.now(),
          updatedAt: Date.now(),
          createdAt: Date.now()
        });
        c = { id: docRef.id, key: key, members: [myUid, otherId], itemId: itemId || '' };
        state.conversations.unshift(c);
      }
      activeConvo = c.id;
    } catch (e) {
      toast('Failed to start chat: ' + e.message);
      return;
    }
  } else {
    activeConvo = c.id;
  }

  go('#/messages');
  render();
}

function viewMessages(){
  var u = me();
  if (!u) return '';
  var myUid = u.id || u.uid;
  var convos = state.conversations.filter(function(c){
    return c.members && c.members.indexOf(myUid) > -1;
  });

  if (!convos.length) {
    return '<div class="container section"><h2>Messages</h2><div style="margin-top:14px">' +
      empty('No conversations yet.', 'Open an item and message its owner to start a conversation.') + '</div></div>';
  }

  if (!activeConvo || !convos.some(function(c){ return c.id === activeConvo; })) {
    activeConvo = convos[0].id;
  }

  listenToActiveConvoMessages(activeConvo);

  var cur = convos.find(function(c){ return c.id === activeConvo; }) || convos[0];
  var otherUid = cur.members.filter(function(x){ return x !== myUid; })[0];
  var other = userById(otherUid);
  var curItem = cur.itemId ? itemById(cur.itemId) : null;
  var cm = state.messages.filter(function(m){ return m.convoId === cur.id; }).sort(function(a, b){
    return (a.at || a.createdAt || 0) - (b.at || b.createdAt || 0);
  });

  return '<div class="container section"><h2>Messages</h2><div class="chat" style="margin-top:14px">' +
    '<div class="card pad">' + convos.map(function(c){
      var o = userById(c.members.filter(function(x){ return x !== myUid; })[0]);
      var ci = c.itemId ? itemById(c.itemId) : null;
      return '<div class="conv ' + (c.id === activeConvo ? 'active' : '') + '" onclick="selectConvo(\'' + c.id + '\')"><strong>' + esc(o ? o.name : 'Student') + '</strong>' +
        (ci ? '<div class="badge b" style="margin:4px 0">' + esc(ci.name) + '</div>' : '') +
        '<div class="muted" style="font-size:12.5px">' + esc(c.lastMessage ? c.lastMessage.slice(0, 34) : 'No messages yet.') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="card pad"><div class="between"><div><strong>' + esc(other ? other.name : 'Student') + '</strong><div class="muted" style="font-size:12.5px">' + esc(other ? ((other.branch || '') + (other.college ? ' · ' + other.college : '')) : '') + '</div></div>' +
    (curItem ? '<a class="badge b" data-nav href="#/item/' + curItem.id + '">About: ' + esc(curItem.name) + '</a>' : '') + '</div>' +
    '<div class="msgs" id="msgs">' + (cm.length ? cm.map(function(m){
      return '<div class="msg ' + (m.from === myUid ? 'me' : '') + '">' + esc(m.text) + '<span class="when">' + new Date(m.at || m.createdAt || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '</span></div>';
    }).join('') : '<div class="muted" style="margin:auto;text-align:center">No messages yet.<br>Send a message to start this student conversation.</div>') + '</div>' +
    '<form id="msgForm" class="row" data-c="' + cur.id + '" style="margin-top:10px;flex-wrap:nowrap"><input name="text" placeholder="Write a message…" autocomplete="off"><button class="btn" type="submit">Send</button></form>' +
    '</div></div></div>';
}

function selectConvo(cid){
  activeConvo = cid;
  render();
}

var activeMessagesUnsub = null;
var currentListeningConvoId = null;

function listenToActiveConvoMessages(convoId){
  if (currentListeningConvoId === convoId) return;
  if (activeMessagesUnsub) {
    activeMessagesUnsub();
    activeMessagesUnsub = null;
  }
  currentListeningConvoId = convoId;
  activeMessagesUnsub = db.collection('messages')
    .where('convoId', '==', convoId)
    .onSnapshot(function(snapshot){
      state.messages = [];
      snapshot.forEach(function(doc){
        state.messages.push(Object.assign({ id: doc.id }, doc.data()));
      });
      state.messages.sort(function(a, b){
        return (a.at || a.createdAt || 0) - (b.at || b.createdAt || 0);
      });
      if ((location.hash || '').indexOf('#/messages') === 0) {
        var box = document.getElementById('msgs');
        if (box) {
          var u = me();
          var myUid = u ? (u.id || u.uid) : '';
          box.innerHTML = state.messages.length ? state.messages.map(function(m){
            return '<div class="msg ' + (m.from === myUid ? 'me' : '') + '">' + esc(m.text) + '<span class="when">' + new Date(m.at || m.createdAt || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '</span></div>';
          }).join('') : '<div class="muted" style="margin:auto;text-align:center">No messages yet.<br>Send a message to start this student conversation.</div>';
          box.scrollTop = box.scrollHeight;
        }
      }
    }, function(err){
      console.warn('Error listening to messages:', err);
    });
}

async function doSend(f){
  var u = me(), text = val(f, 'text');
  if (!text) return;
  var cid = f.dataset.c;
  var myUid = u.id || u.uid;
  var input = f.elements['text'];
  if (input) input.value = '';

  try {
    await db.collection('messages').add({
      convoId: cid,
      from: myUid,
      text: text,
      at: Date.now(),
      createdAt: Date.now()
    });

    await db.collection('conversations').doc(cid).update({
      lastMessage: text,
      updatedAt: Date.now()
    });

    var c = state.conversations.find(function(x){ return x.id === cid; });
    if (c) {
      var otherId = c.members.filter(function(x){ return x !== myUid; })[0];
      if (otherId) {
        notifyUser(otherId, 'New message from ' + (u.name || 'Student') + ': "' + (text.slice(0, 30)) + '"', 'chat', '#/messages');
      }
    }
  } catch (err) {
    console.error('Failed to send message:', err);
    toast('Error sending message: ' + err.message);
  }
}

/* ---------- Reviews ---------- */
function openReview(rid){
  var r = state.rentals.find(function(x){ return x.id === rid; });
  if (!r) return;
  var w = document.createElement('div');
  w.className = 'modal-bg';
  w.id = 'modal';
  w.innerHTML = '<div class="card pad modal"><h3>Leave a review</h3><form id="reviewForm" data-r="' + rid + '" novalidate>' +
    '<label>Star rating</label><div class="stars" id="starPick" data-v="0">☆☆☆☆☆</div><div class="err" data-e="rating"></div>' +
    '<label>Your review</label><textarea name="text" rows="4"></textarea><div class="err" data-e="text"></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" type="submit">Submit review</button><button type="button" class="btn ghost" onclick="document.getElementById(\'modal\').remove()">Cancel</button></div></form></div>';
  document.body.appendChild(w);

  var sp = document.getElementById('starPick');
  sp.onclick = function(e){
    var rect = sp.getBoundingClientRect();
    var v = Math.min(5, Math.max(1, Math.ceil((e.clientX - rect.left) / (rect.width / 5))));
    sp.dataset.v = v;
    sp.textContent = '★'.repeat(v) + '☆'.repeat(5 - v);
  };
}

async function doReview(f){
  var u = me(), rid = f.dataset.r;
  var rating = Number(document.getElementById('starPick').dataset.v);
  var text = val(f, 'text'), errs = {};
  if (!rating) errs.rating = 'Select a star rating.';
  if (!text) errs.text = 'Please write a short review.';
  if (!setErrs(f, errs)) return;

  var r = state.rentals.find(function(x){ return x.id === rid; });
  if (!r) return;

  var btn = f.querySelector('button[type="submit"]') || f.querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

  try {
    await db.collection('reviews').add({
      rentalId: rid,
      itemId: r.itemId,
      userId: u.id || u.uid,
      ownerId: r.ownerId,
      rating: rating,
      text: text,
      at: Date.now(),
      createdAt: Date.now()
    });

    await db.collection('rentals').doc(rid).update({ reviewed: true });
    await notifyUser(r.ownerId, (u.name || 'Student') + ' left a ' + rating + '-star review.', 'review', '#/profile');

    var modal = document.getElementById('modal');
    if (modal) modal.remove();
    toast('Review submitted');
    render();
  } catch (err) {
    toast('Error: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Submit review'; }
  }
}

/* ---------- Profile ---------- */
function updateProfileYears(){
  var courseEl = document.getElementById('profCourse');
  var branchEl = document.getElementById('profBranch');
  var yearEl = document.getElementById('profYearSelect');
  var durEl = document.getElementById('profDurationText');
  if (!yearEl) return;

  var cVal = courseEl ? courseEl.value : 'B.Tech';
  var bVal = branchEl ? branchEl.value : '';
  var data = getCourseYears(cVal, bVal);
  if (durEl) durEl.textContent = 'Course Duration: ' + data.duration;

  var previousYear = yearEl.value;
  yearEl.innerHTML = '';

  var defaultOpt = document.createElement('option');
  defaultOpt.value = '';
  defaultOpt.textContent = 'Select year';
  yearEl.appendChild(defaultOpt);

  var isPreviousYearValid = false;
  data.years.forEach(function(y){
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (previousYear && (previousYear === y || previousYear === y.replace(/[^0-9]/g, ''))) {
      opt.selected = true;
      isPreviousYearValid = true;
    }
    yearEl.appendChild(opt);
  });

  if (!isPreviousYearValid) {
    yearEl.value = '';
  }
}

function viewProfile(){
  var u = me();
  if (!u) return '';
  var myUid = u.id || u.uid;
  var items = state.items.filter(function(i){ return i.ownerId === myUid; });
  var revs = state.reviews.filter(function(r){ return r.ownerId === myUid; });
  var avg = revs.length ? (revs.reduce(function(s, r){ return s + r.rating; }, 0) / revs.length).toFixed(1) : null;
  var currentCourse = u.course || 'B.Tech';
  var courseInfo = getCourseYears(currentCourse, u.branch);

  return '<div class="container section"><h2>My Profile</h2><div class="grid g2" style="margin-top:14px">' +
    '<div class="card pad"><form id="profileForm" novalidate>' +
    '<label>Full Name</label><input name="name" value="' + esc(u.name || '') + '"><div class="err" data-e="name"></div>' +
    '<label>College Name</label><input name="college" value="' + esc(u.college || '') + '"><div class="err" data-e="college"></div>' +
    '<label>Course</label><select name="course" id="profCourse" onchange="updateProfileYears()">' +
    COURSES.map(function(c){
      return '<option value="' + c + '"' + (c === currentCourse ? ' selected' : '') + '>' + c + '</option>';
    }).join('') + '</select>' +
    '<label>Branch</label><input name="branch" id="profBranch" oninput="updateProfileYears()" value="' + esc(u.branch || '') + '"><div class="err" data-e="branch"></div>' +
    '<div class="between"><label style="margin:14px 0 6px">Current Year of Study</label><span class="muted" style="font-size:12px;margin-top:14px" id="profDurationText">Course Duration: ' + courseInfo.duration + '</span></div>' +
    '<select name="year" id="profYearSelect"><option value="">Select year</option>' + courseInfo.years.map(function(y){
      var isSel = (String(u.year) === y || String(u.year) === y.replace(/[^0-9]/g, ''));
      return '<option value="' + y + '"' + (isSel ? ' selected' : '') + '>' + y + '</option>';
    }).join('') + '</select>' +
    '<label>College Email</label><input name="email" value="' + esc(u.email || '') + '" readonly style="opacity:.7;cursor:not-allowed"><div class="err" data-e="email"></div>' +
    '<label>New Password (optional)</label><input name="password" type="password" placeholder="Leave blank to keep unchanged"><div class="err" data-e="password"></div>' +
    '<button class="btn" style="margin-top:16px;width:100%" type="submit">Save profile</button></form></div>' +
    '<div class="card pad"><h3>Activity</h3><table><tr><th>Listed items</th><td>' + items.length + '</td></tr>' +
    '<tr><th>Owner rating</th><td>' + (avg ? '★ ' + avg + ' (' + revs.length + ' reviews)' : 'No reviews yet.') + '</td></tr></table>' +
    '<h3 style="margin-top:18px">Reviews received</h3>' +
    (revs.length ? revs.map(function(r){
      return '<div style="border-top:1px solid var(--border);padding:9px 0"><span class="stars">' + '★'.repeat(r.rating) + '</span><div class="muted">' + esc(r.text) + '</div></div>';
    }).join('') : empty('No reviews yet.', '')) + '</div></div></div>';
}

async function doProfile(f){
  var u = me(), errs = {}, d = {};
  if (!u) return;
  var myUid = u.id || u.uid;

  ['name','college','branch','password'].forEach(function(n){ d[n] = val(f, n); });
  ['name','college','branch'].forEach(function(n){ if (!d[n]) errs[n] = 'This field is required.'; });
  if (d.password && d.password.length < 6) errs.password = 'Password must be at least 6 characters.';
  if (!setErrs(f, errs)) return;

  var btn = f.querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  try {
    if (auth.currentUser && d.name !== auth.currentUser.displayName) {
      await auth.currentUser.updateProfile({ displayName: d.name });
    }
    if (d.password && auth.currentUser) {
      await auth.currentUser.updatePassword(d.password);
    }

    var courseName = val(f, 'course') || u.course || 'B.Tech';
    var profileData = {
      name: d.name,
      college: d.college,
      course: courseName,
      branch: d.branch,
      year: val(f, 'year') || u.year || '',
      updatedAt: Date.now()
    };

    await db.collection('users').doc(myUid).set(profileData, { merge: true });
    currentUser = Object.assign({}, currentUser, profileData);
    state.users[myUid] = currentUser;
    toast('Profile updated');
    render();
  } catch (err) {
    console.error('Error saving profile:', err);
    toast('Error updating profile: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Save profile'; }
  }
}

/* ---------- Firebase Real-Time Listeners ---------- */
var unsubs = [];

function clearListeners(){
  unsubs.forEach(function(u){ if (typeof u === 'function') u(); });
  unsubs = [];
  if (activeMessagesUnsub) { activeMessagesUnsub(); activeMessagesUnsub = null; }
  currentListeningConvoId = null;
}

// Global real-time listeners for public listings and reviews
db.collection('listings').onSnapshot(function(snapshot){
  state.items = [];
  snapshot.forEach(function(doc){
    state.items.push(Object.assign({ id: doc.id }, doc.data()));
  });
  fetchMissingUsers(state.items.map(function(i){ return i.ownerId; }));
  render();
}, function(err){
  console.warn('Listings listener error:', err);
});

db.collection('reviews').onSnapshot(function(snapshot){
  state.reviews = [];
  snapshot.forEach(function(doc){
    state.reviews.push(Object.assign({ id: doc.id }, doc.data()));
  });
  fetchMissingUsers(state.reviews.map(function(r){ return r.userId; }));
  render();
}, function(err){
  console.warn('Reviews listener error:', err);
});

// User-specific listeners (rentals, conversations, notifications)
function initUserListeners(uid){
  clearListeners();

  // 1. Rentals where user is renter
  var u1 = db.collection('rentals').where('renterId', '==', uid).onSnapshot(function(snap){
    var renterRentals = [];
    snap.forEach(function(doc){ renterRentals.push(Object.assign({ id: doc.id }, doc.data())); });
    mergeRentals(renterRentals, 'renter');
  }, function(e){ console.warn('Renter rentals error:', e); });
  unsubs.push(u1);

  // 2. Rentals where user is owner
  var u2 = db.collection('rentals').where('ownerId', '==', uid).onSnapshot(function(snap){
    var ownerRentals = [];
    snap.forEach(function(doc){ ownerRentals.push(Object.assign({ id: doc.id }, doc.data())); });
    mergeRentals(ownerRentals, 'owner');
  }, function(e){ console.warn('Owner rentals error:', e); });
  unsubs.push(u2);

  // 3. User conversations
  var u3 = db.collection('conversations').where('members', 'array-contains', uid).onSnapshot(function(snap){
    state.conversations = [];
    snap.forEach(function(doc){ state.conversations.push(Object.assign({ id: doc.id }, doc.data())); });
    state.conversations.sort(function(a, b){ return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0); });
    var otherIds = [];
    state.conversations.forEach(function(c){
      c.members.forEach(function(m){ if (m !== uid) otherIds.push(m); });
    });
    fetchMissingUsers(otherIds);
    render();
  }, function(e){ console.warn('Conversations listener error:', e); });
  unsubs.push(u3);

  // 4. Notifications
  var u4 = db.collection('notifications').where('userId', '==', uid).onSnapshot(function(snap){
    state.notifications = [];
    snap.forEach(function(doc){ state.notifications.push(Object.assign({ id: doc.id }, doc.data())); });
    state.notifications.sort(function(a, b){ return (b.at || b.createdAt || 0) - (a.at || a.createdAt || 0); });
    render();
  }, function(e){ console.warn('Notifications listener error:', e); });
  unsubs.push(u4);
}

var _cachedRenterRentals = [];
var _cachedOwnerRentals = [];

function mergeRentals(list, type){
  if (type === 'renter') _cachedRenterRentals = list;
  if (type === 'owner') _cachedOwnerRentals = list;
  var map = {};
  _cachedRenterRentals.concat(_cachedOwnerRentals).forEach(function(r){
    map[r.id] = r;
  });
  state.rentals = Object.values(map);
  var userIds = [];
  state.rentals.forEach(function(r){
    userIds.push(r.renterId);
    userIds.push(r.ownerId);
  });
  fetchMissingUsers(userIds);
  render();
}

/* ---------- Firebase Auth State Observer ---------- */
auth.onAuthStateChanged(async function(user){
  if (user) {
    try {
      var userDoc = await db.collection('users').doc(user.uid).get();
      if (userDoc.exists) {
        currentUser = Object.assign({ uid: user.uid, id: user.uid }, userDoc.data());
      } else {
        currentUser = {
          uid: user.uid,
          id: user.uid,
          name: user.displayName || user.email.split('@')[0],
          email: user.email,
          at: Date.now()
        };
      }
      state.users[user.uid] = currentUser;
      initUserListeners(user.uid);
    } catch (e) {
      console.error('Error fetching user profile:', e);
      currentUser = { uid: user.uid, id: user.uid, name: user.displayName || user.email.split('@')[0], email: user.email };
    }
  } else {
    currentUser = null;
    clearListeners();
    state.rentals = [];
    state.conversations = [];
    state.messages = [];
    state.notifications = [];
  }
  render();
});

// Initial Render
render();
</script>
